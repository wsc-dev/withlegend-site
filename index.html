<style>
  :root{
    --navy: #00001A;
    --navy-2: #0B0F2E;
    --gold: #B59948;
    --gold-soft: #E4D9B8;
    --paper: #FBFAF7;
    --ink-soft: rgba(255,255,255,0.62);
    --rule: rgba(181,153,72,0.35);
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0;
    height:100%;
  }
  body{
    background:
      radial-gradient(ellipse 70% 55% at 50% 32%, rgba(181,153,72,0.20), transparent 60%),
      var(--navy-2);
    color: #F4F2EA;
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    -webkit-font-smoothing: antialiased;
  }
  .stage{
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    text-align: center;
  }
  .logo{
    display: block;
    width: min(220px, 46vw);
    height: auto;
    margin: 0 auto 8px;
    opacity: 0;
    filter: drop-shadow(0 0 1px rgba(244,242,234,0.45)) drop-shadow(0 0 24px rgba(181,153,72,0.35));
    animation: rise 0.9s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .eyebrow{
    font-family: "Shippori Mincho", serif;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 0.28em;
    color: var(--gold);
    text-transform: uppercase;
    margin: 22px 0 0;
    max-width: 100%;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.35s forwards;
  }
  .rule{
    width: 44px;
    height: 1px;
    background: var(--rule);
    margin: 0 auto 28px;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.15s forwards;
  }
  h1{
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: clamp(19px, 4.6vw, 29px);
    line-height: 1.7;
    letter-spacing: 0.03em;
    margin: 0;
    max-width: 100%;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.25s forwards;
  }
  @media (max-width: 480px){
    h1 br{ display: none; }
  }
  .mission{
    font-size: 14.5px;
    line-height: 1.95;
    color: var(--ink-soft);
    margin: 26px auto 40px;
    max-width: min(30em, 100%);
    opacity: 0;
    animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.45s forwards;
  }
  .mission b{
    color: var(--gold-soft);
    font-weight: 500;
  }
  .contact{
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 22px 34px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.55s forwards;
  }
  .contact .label{
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .contact a{
    color: var(--gold-soft);
    font-size: 19px;
    font-weight: 500;
    text-decoration: none;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .contact a:hover, .contact a:focus-visible{
    color: var(--gold);
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .contact a:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 4px;
  }
  footer{
    margin-top: 48px;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: rgba(244,242,234,0.35);
    opacity: 0;
    animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.65s forwards;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .logo, .eyebrow, .rule, h1, .mission, .contact, footer{
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
